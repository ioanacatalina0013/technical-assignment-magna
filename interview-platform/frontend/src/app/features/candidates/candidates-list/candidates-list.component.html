<div class="header-row">
  <h1>Candidates</h1>
  <button mat-flat-button color="primary" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon> New candidate
  </button>
</div>

<mat-form-field appearance="outline" class="search-field">
  <mat-label>Search by name or email</mat-label>
  <input matInput (input)="onSearchChange($any($event.target).value)" />
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

@if (loading()) {
  <mat-spinner diameter="40"></mat-spinner>
} @else if (candidates().length === 0) {
  <p class="empty">No candidates found.</p>
} @else {
  <table mat-table [dataSource]="candidates()" class="full-width">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let c">{{ c.name }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let c">{{ c.email || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="sessions">
      <th mat-header-cell *matHeaderCellDef>Sessions</th>
      <td mat-cell *matCellDef="let c">{{ c._count?.sessions ?? 0 }}</td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef>Added</th>
      <td mat-cell *matCellDef="let c">{{ c.createdAt | date: 'mediumDate' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="openRow(row)" class="clickable-row"></tr>
  </table>

  <mat-paginator
    [length]="total()"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="onPage($event)"
  ></mat-paginator>
}
